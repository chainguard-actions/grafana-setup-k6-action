name: Test latest k6 version (no version input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert k6 is installed
        run: |
          which k6 || { echo "FAIL: k6 not on PATH"; exit 1; }
          OUT="$(k6 version)"
          echo "k6 version: $OUT"
          if ! echo "$OUT" | grep -qE "v[0-9]+\.[0-9]+\.[0-9]+"; then
            echo "FAIL: k6 version output does not contain a semver"
            exit 1
          fi
          echo "PASS"
