name: Test k6 installation with browser dependencies
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install k6 with browser support
        id: action
        uses: .
        with:
          k6-version: '0.54.0'
          browser: 'true'

      - name: Assert k6 is installed
        run: |
          echo "Checking k6 is on PATH..."
          if ! command -v k6 &>/dev/null; then
            echo "FAIL: k6 not found on PATH"
            exit 1
          fi
          echo "PASS: k6 is installed"

      - name: Assert K6_BROWSER_ARGS env var is set
        env:
          BROWSER_ARGS: ${{ env.K6_BROWSER_ARGS }}
        run: |
          echo "K6_BROWSER_ARGS: $BROWSER_ARGS"
          if [ "$BROWSER_ARGS" != "no-sandbox" ]; then
            echo "FAIL: expected K6_BROWSER_ARGS='no-sandbox' but got: '$BROWSER_ARGS'"
            exit 1
          fi
          echo "PASS: K6_BROWSER_ARGS is set to 'no-sandbox'"
