name: Test k6 browser setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          k6-version: '0.49.0'
          browser: 'true'
      - name: Assert K6_BROWSER_ARGS is set to no-sandbox
        run: |
          echo "K6_BROWSER_ARGS: '$K6_BROWSER_ARGS'"
          if [ "$K6_BROWSER_ARGS" != "no-sandbox" ]; then
            echo "FAIL: expected K6_BROWSER_ARGS='no-sandbox', got '$K6_BROWSER_ARGS'"
            exit 1
          fi
          echo "PASS: K6_BROWSER_ARGS is set correctly"
      - name: Assert google-chrome-stable is installed
        run: |
          echo "which google-chrome-stable: $(which google-chrome-stable 2>/dev/null || echo 'not found')"
          if ! command -v google-chrome-stable &>/dev/null; then
            echo "FAIL: google-chrome-stable not found"
            exit 1
          fi
          echo "PASS: google-chrome-stable is installed"
      - name: Assert k6 is still on PATH
        run: |
          if ! command -v k6 &>/dev/null; then
            echo "FAIL: k6 not found on PATH after browser setup"
            exit 1
          fi
          echo "k6 version: $(k6 version 2>&1)"
          echo "PASS"
