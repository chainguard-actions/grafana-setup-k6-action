name: Test k6 setup with browser dependencies
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          k6-version: '0.49.0'
          browser: 'true'
      - name: Assert k6-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.k6-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: k6-version output is empty"
            exit 1
          fi
          echo "PASS: k6-version output = $ACTUAL"
      - name: Assert k6 binary is available
        run: |
          if ! command -v k6 &> /dev/null; then
            echo "FAIL: k6 binary not found in PATH"
            exit 1
          fi
          echo "PASS: k6 is available at $(which k6)"
          k6 version
