name: Test k6 installation with browser dependencies
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          browser: 'true'
      - name: Assert k6 is installed
        run: |
          echo "Checking k6 is available..."
          which k6 || { echo "FAIL: k6 not found in PATH"; exit 1; }
          echo "PASS: k6 is installed"
      - name: Assert k6 version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.k6-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: k6-version output is empty"
            exit 1
          fi
          echo "PASS: k6-version output is set to $ACTUAL"
