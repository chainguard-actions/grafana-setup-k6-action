name: Test k6 with browser dependencies
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install Google Chrome so the action skips browser installation
        run: |
          # Install Chrome so the action's checkChromeInstalled() returns true
          # and skips the slow apt installation step
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add - 2>/dev/null || true
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google-chrome.list' || true
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq google-chrome-stable || true
          # Verify Chrome is available (best effort)
          google-chrome --version 2>/dev/null || echo "Chrome not available, action will attempt installation"

      - id: action
        name: Setup k6 with browser support
        uses: .
        with:
          k6-version: '0.54.0'
          browser: 'true'

      - name: Assert k6 is installed and runnable
        run: |
          echo "Checking k6 is on PATH..."
          which k6 || { echo "FAIL: k6 not found on PATH"; exit 1; }
          k6 version || { echo "FAIL: k6 version command failed"; exit 1; }
          echo "PASS: k6 is installed and runnable"

      - name: Assert K6_BROWSER_ARGS env var is set to no-sandbox
        run: |
          echo "K6_BROWSER_ARGS: $K6_BROWSER_ARGS"
          if [ "$K6_BROWSER_ARGS" != "no-sandbox" ]; then
            echo "FAIL: expected K6_BROWSER_ARGS='no-sandbox' but got '$K6_BROWSER_ARGS'"
            exit 1
          fi
          echo "PASS: K6_BROWSER_ARGS is set correctly"

      - name: Assert installed k6 binary reports correct version
        run: |
          INSTALLED_VERSION=$(k6 version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "Installed k6 version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "0.54.0" ]; then
            echo "FAIL: expected version 0.54.0 but got $INSTALLED_VERSION"
            exit 1
          fi
          echo "PASS: k6 version matches expected 0.54.0"
