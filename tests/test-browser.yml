name: Test k6 setup with browser dependencies
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          browser: 'true'
          github-token: ${{ github.token }}
      - name: Assert k6 is installed
        run: |
          echo "Checking k6 is on PATH..."
          if ! command -v k6 &>/dev/null; then
            echo "FAIL: k6 not found on PATH"
            exit 1
          fi
          echo "PASS: k6 found at $(command -v k6)"
      - name: Assert k6 runs successfully
        run: |
          echo "Running k6 version command..."
          k6 version
          if [ $? -ne 0 ]; then
            echo "FAIL: k6 version command failed"
            exit 1
          fi
          echo "PASS: k6 version command succeeded"
      - name: Assert K6_BROWSER_ARGS env var is set
        run: |
          echo "K6_BROWSER_ARGS: $K6_BROWSER_ARGS"
          if [ -z "$K6_BROWSER_ARGS" ]; then
            echo "FAIL: K6_BROWSER_ARGS is not set"
            exit 1
          fi
          echo "PASS: K6_BROWSER_ARGS is set to '$K6_BROWSER_ARGS'"
