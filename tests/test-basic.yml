name: Test basic k6 setup (no inputs)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert k6 is installed
        run: |
          echo "Checking k6 binary is available..."
          if ! command -v k6 &>/dev/null; then
            echo "FAIL: k6 binary not found in PATH"
            exit 1
          fi
          echo "PASS: k6 is installed"
          k6 version
      - name: Assert k6-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.k6-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: k6-version output is empty"
            exit 1
          fi
          echo "PASS: k6-version output is '$ACTUAL'"
