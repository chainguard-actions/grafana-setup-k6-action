name: Test basic usage - install latest k6
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Setup k6 (latest version)
        uses: .

      - name: Assert k6 is installed and runnable
        run: |
          echo "Checking k6 is on PATH..."
          which k6 || { echo "FAIL: k6 not found on PATH"; exit 1; }
          k6 version || { echo "FAIL: k6 version command failed"; exit 1; }
          echo "PASS: k6 is installed and runnable"

      - name: Assert k6 version output is a valid semver
        run: |
          K6_VER=$(k6 version 2>&1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "k6 version from binary: $K6_VER"
          if [ -z "$K6_VER" ]; then
            echo "FAIL: could not parse k6 version from binary"
            exit 1
          fi
          echo "PASS: k6 version is '$K6_VER'"
