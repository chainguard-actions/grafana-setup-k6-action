name: Test basic k6 installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          k6-version: '0.49.0'
      - name: Assert k6 is on PATH and runs
        run: |
          echo "which k6: $(which k6 || echo 'not found')"
          if ! command -v k6 &>/dev/null; then
            echo "FAIL: k6 not found on PATH"
            exit 1
          fi
          K6_OUT="$(k6 version 2>&1)"
          echo "k6 version output: $K6_OUT"
          if ! echo "$K6_OUT" | grep -q "0.49.0"; then
            echo "FAIL: expected k6 version 0.49.0 in output"
            exit 1
          fi
          echo "PASS"
