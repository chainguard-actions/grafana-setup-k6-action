name: Test k6 setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          k6-version: '0.54.0'
      - name: Assert k6-version output matches requested version
        env:
          K6_VERSION: ${{ steps.action.outputs.k6-version }}
        run: |
          echo "k6-version output: $K6_VERSION"
          if [ -z "$K6_VERSION" ]; then
            echo "FAIL: k6-version output is empty"
            exit 1
          fi
          if [[ "$K6_VERSION" != *"0.54.0"* ]]; then
            echo "FAIL: expected version to contain '0.54.0', got '$K6_VERSION'"
            exit 1
          fi
          echo "PASS: k6-version output is '$K6_VERSION'"
      - name: Assert k6 binary reports correct version
        run: |
          echo "Checking k6 version..."
          K6_BIN_VERSION=$(k6 version 2>&1 || true)
          echo "k6 version output: $K6_BIN_VERSION"
          if [[ "$K6_BIN_VERSION" != *"0.54.0"* ]]; then
            echo "FAIL: expected k6 binary version to contain '0.54.0'"
            exit 1
          fi
          echo "PASS"
