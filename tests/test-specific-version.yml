name: Test k6 setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          k6-version: '0.54.0'
          github-token: ${{ github.token }}
      - name: Assert k6 binary is available
        run: |
          echo "Checking k6 binary..."
          if ! command -v k6 &>/dev/null; then
            echo "FAIL: k6 binary not found in PATH"
            exit 1
          fi
          K6_BIN_VERSION=$(k6 version)
          echo "k6 binary version output: $K6_BIN_VERSION"
          if ! echo "$K6_BIN_VERSION" | grep -q "0.54.0"; then
            echo "FAIL: k6 binary does not report version 0.54.0"
            exit 1
          fi
          echo "PASS: k6 binary reports correct version"
      - name: Assert k6-version output (may be empty if action does not set it)
        env:
          K6_VERSION: ${{ steps.action.outputs.k6-version }}
        run: |
          echo "k6-version output: '$K6_VERSION'"
          # The action declares this output but may not set it; just log it
          echo "PASS: action completed successfully"
