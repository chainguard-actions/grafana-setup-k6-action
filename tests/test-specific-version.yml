name: Test k6 setup with specific version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-k6
        uses: .
        with:
          k6-version: '0.54.0'
      - name: Assert k6 binary is available
        run: |
          echo "Checking k6 binary..."
          if ! command -v k6 &>/dev/null; then
            echo "FAIL: k6 binary not found in PATH"
            exit 1
          fi
          echo "PASS: k6 is available at $(command -v k6)"
      - name: Assert k6 version matches requested version
        run: |
          echo "Running k6 version..."
          K6_OUTPUT=$(k6 version)
          echo "k6 version output: $K6_OUTPUT"
          if ! echo "$K6_OUTPUT" | grep -q "0.54.0"; then
            echo "FAIL: k6 version output does not contain '0.54.0'"
            exit 1
          fi
          echo "PASS: k6 version matches requested version"
