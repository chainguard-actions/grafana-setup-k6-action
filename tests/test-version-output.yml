name: Test k6-version output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          k6-version: '0.48.0'
      - name: Assert k6-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.k6-version }}
        run: |
          echo "actual k6-version output: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "WARN: k6-version output is empty (action may not set this output explicitly)"
          fi
          # Verify k6 is installed at the requested version regardless
          K6_OUT="$(k6 version 2>&1)"
          echo "k6 version output: $K6_OUT"
          if ! echo "$K6_OUT" | grep -q "0.48.0"; then
            echo "FAIL: expected k6 version 0.48.0 in output"
            exit 1
          fi
          echo "PASS"
